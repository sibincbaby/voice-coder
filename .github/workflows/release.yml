name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, type-check, test, build)
        run: pnpm run ci

      - name: Package VS Code extension (.vsix)
        run: pnpm run package

      - name: Package CLI tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="voice-coder-cli-${VERSION}"
          mkdir -p "dist/${STAGE}/out" "dist/${STAGE}/scripts"
          cp out/cli.js "dist/${STAGE}/out/"
          cp scripts/tray.py scripts/install-cli.sh scripts/install-desktop.sh "dist/${STAGE}/scripts/"
          cp README.md LICENSE CHANGELOG.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.vsix
            dist/voice-coder-cli-*.tar.gz
