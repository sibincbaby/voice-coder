name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, type-check, test, build)
        run: pnpm run ci

      - name: Package CLI tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="voice-coder-${VERSION}"
          mkdir -p "dist/${STAGE}/out" "dist/${STAGE}/scripts"
          cp out/cli.js out/dashboard.js "dist/${STAGE}/out/"
          cp scripts/tray.py scripts/install-cli.sh scripts/install-desktop.sh "dist/${STAGE}/scripts/"
          cp README.md LICENSE CHANGELOG.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/voice-coder-*.tar.gz

      # Publishes to npm when an NPM_TOKEN secret is configured. Skipped otherwise.
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
